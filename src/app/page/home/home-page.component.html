<section class="home">
    <app-navbar>
    </app-navbar>
    <div class="home-body">
        @for (inn of inns; track $index) {
        <a [routerLink]="['/room', inn.id]">
            <room-card [city]="inn.location.city" [kingdom]="inn.location.kingdom" [name]="inn.name"

        }
    </div>
    <app-footer></app-footer>
</section>
