<section class="home">
    <app-navbar>
    </app-navbar>
    <div class="home-body">
        @for (stay of stays; track $index) {
        <a [routerLink]="['/room', stay.id]">
            <room-card [city]="stay.location.city" [kingdom]="stay.location.kingdom" [name]="stay.name"
                [pricePerNight]="stay.pricePerNight" [ratings]="stay.ratings" [imgsUrls]="stay.imgsUrls"></room-card>
        </a>
        }
    </div>
    <app-footer></app-footer>
</section>
