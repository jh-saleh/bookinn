<section class="counter">
    <button class="counter-button" [disabled]="counter === minimum" (click)="decrease()">
        <span class="material-symbols-outlined">
            remove
        </span>
    </button>
    <span>
        {{counter}}
    </span>
    <button class="counter-button" [disabled]="counter === maximum || blockIncreaseAction" (click)="increase()">
        <span class="material-symbols-outlined">
            add
        </span>
    </button>
</section>
