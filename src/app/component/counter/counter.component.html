<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<section class="counter">
    <button class="counter-button" [disabled]="counter === minimum" (click)="decrease()">
        <span class="material-symbols-outlined">
            remove
        </span>
    </button>
    <span>
        {{counter}}
    </span>
    <button class="counter-button" [disabled]="counter === maximum" (click)="increase()">
        <span class="material-symbols-outlined">
            add
        </span>
    </button>
</section>
