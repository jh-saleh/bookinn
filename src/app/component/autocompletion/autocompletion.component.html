<div class="autocompletion-wrapper">
    @for (city of suggestions; track $index) {
    <div class="autocompletion-suggestion" (click)="suggestionClickHandler(city)">
        <span class="material-symbols-outlined">
            location_on
        </span>
        <span>
            {{city}}
        </span>
    </div>
    }
    @if(suggestions.length === 0){
    <div class="no-suggestion-found">
        <span class="material-symbols-outlined">
            hide_source
        </span>
        <span>
            Nothing found
        </span>
    </div>
    }
</div>
