<div class="card">
    <div class="card-header">
        @if(canUsePreviousImageButton){
        <button class="previous-image" (click)="goToPreviousImage($event)">
            <span class="material-symbols-outlined">
                chevron_left
            </span>
        </button>
        }
        <div class="slider">
            @for(url of imgsUrls; track $index){
            <img class="slide" [ngClass]="translateClass" [src]="url" alt="a bedroom picture" />
            }
        </div>
        @if(canUseNextImageButton){
        <button class="next-image" (click)="goToNextImage($event)">
            <span class="material-symbols-outlined">
                chevron_right
            </span>
        </button>
        }
    </div>
    <div class="card-body-wrapper">
        <span class="card-body">
            <div>
                <span>
                    {{city}}, {{kingdom}}
                </span>
                @if(distanceToOrigin){
                <div class="location-distance">
                    {{distanceToOrigin}} {{ distanceToOrigin | pluralize: 'kilometer'}} away
                </div>
                }
            </div>
            <div class="price">
                ${{pricePerNight}} night
            </div>
        </span>
        <span class="ratings">
            <div>
                {{ratings}}
                <span class="material-symbols-outlined">
                    star
                </span>
            </div>
        </span>
    </div>
</div>
