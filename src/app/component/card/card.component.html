<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<div class="card">
    <div class="card-header">

    </div>
    <div class="card-body">
        <div class="location-ratings">
            <span>
                {{city}}, {{state}}
            </span>
            <span class="ratings">
                {{ratings}}
                <span class="material-symbols-outlined">
                    star
                </span>
            </span>
        </div>
        <div class="price">
            ${{pricePerNight}} night
        </div>
    </div>
</div>
